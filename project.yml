name: ZhuJi
options:
  bundleIdPrefix: com.xhshen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
targets:
  ZhuJi:
    type: application
    platform: iOS
    sources: [ZhuJi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xhshen.traveldiary
        PRODUCT_NAME: "驻迹"
        INFOPLIST_FILE: ZhuJi/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: [ZhuJiTests]
  ZhuJiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ZhuJiTests]
    dependencies:
      - target: ZhuJi

